name = "CoveringLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CoveringLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "CoveringLean"

# Os dois certificados de busca: 38 + 95 módulos, ~12 h de CPU somadas.
# Fora do alvo padrão para `lake build` continuar em segundos; rode `lake build CoveringHeavy`.
[[lean_lib]]
name = "CoveringHeavy"
srcDir = "."
roots = ["CoveringLean.SearchK6ge12", "CoveringLean.K3_K7_9_4_Final"]
