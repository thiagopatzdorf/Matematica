# Compila a lib CoveringSyn: os certificados por síndromes (K_7(9,4) ≤ 1134 … ≤ 1351, K_7(8,3) ≤ 1887,
# K_5(10,5) ≤ 162, K_5(11,4) ≤ 2875, K_7(10,4) ≤ 5616). Fora do alvo padrão porque custa ~20–40 min
# de parede em 4 núcleos; sem este job, um certificado quebrado só aparecia no build manual (achado da v0.6).
# Roda só quando algo que o certificado lê muda. Repo público: runner hospedado do GitHub sem custo.
name: lean-syn

on:
  push:
    branches: [main]
    paths:
      - "CoveringLean/Syn*.lean"
      - "CoveringLean/A2_Sphere.lean"
      - "data/structured/**"
      - "scripts/syndrome/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean-syn.yml"
  pull_request:
    paths:
      - "CoveringLean/Syn*.lean"
      - "CoveringLean/A2_Sphere.lean"
      - "data/structured/**"
      - "scripts/syndrome/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean-syn.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syn:
    name: lake build CoveringSyn (certificados por síndromes)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: false
      # Cache dos .olean do projeto (.lake/build), DEPOIS da lean-action para prevalecer sobre ela. A
      # lean-action já guarda o `.lake` inteiro sob `lake-<SO>-<hashes>-<sha>`, a mesma chave que o job
      # `lean` do verify-codes (alvo padrão, 2 min) grava no mesmo sha; o que ela restaura aqui não traz os
      # .olean do CoveringSyn (medido 05–07/10: 37 min por run, ~500 módulos recompilados toda vez). Esta
      # chave é só deste job, e o lake recompila só o módulo cujo fonte mudou (hash no .trace). Com ela, as
      # 6 folhas pesadas (≈31 GB se rodassem juntas) só recompilam quando o certificado delas muda, e aí
      # seguem em série como abaixo: pico de uma folha (≤ 7,5 GB, linhas PICO), nunca a soma. Só a main grava.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-syn-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: lake-syn-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      # O runner hospedado (16 GB) recebeu "shutdown signal" duas vezes no #107 (exit 143) no mesmo
      # ponto: logo depois de SynLeaf_K2_21_3_3072_4, quando o lake pôs para rodar juntas as folhas que
      # mais custam (K2_21_3_3072_0..3 ~150 s cada, K2_24_5_1024_0 ~170 s, K2_23_4_2048_0 ~70 s; tempos
      # do run verde da main). Estas folhas vão em série antes do resto, e a memória e o disco ficam no
      # log a cada 30 s (linhas MON) e por folha (linhas PICO), para a causa ser medida e não suposta.
      - name: lake build CoveringSyn (folhas pesadas em série, memória medida)
        run: |
          set -euo pipefail
          [ -x /usr/bin/time ] || { sudo apt-get update -qq && sudo apt-get install -y -qq time; }
          ( while true; do
              echo "MON $(date -u +%T) $(free -m | awk '/Mem:/{print "mem_usada="$3"MB disponivel="$7"MB"}') $(free -m | awk '/Swap:/{print "swap_usada="$3"MB"}') disco_livre=$(df -h / | awk 'NR==2{print $4}')"
              sleep 30
            done ) &
          MON=$!
          for m in SynLeaf_K2_24_5_1024_0 SynLeaf_K2_21_3_3072_0 SynLeaf_K2_21_3_3072_1 \
                   SynLeaf_K2_21_3_3072_2 SynLeaf_K2_21_3_3072_3 SynLeaf_K2_23_4_2048_0; do
            /usr/bin/time -f "PICO $m maxrss=%MkB parede=%es" lake build "CoveringLean.$m"
          done
          lake build CoveringSyn
          echo "MON fim $(free -m | awk '/Mem:/{print "mem_usada="$3"MB"}') disco_livre=$(df -h / | awk 'NR==2{print $4}') lake=$(du -sh .lake | cut -f1)"
          kill "$MON"
      # Grava logo depois do build (antes dos axiomas): um run que falhe nos axiomas não perde a compilação.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-syn-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
      # Cada teorema final só com os três axiomas padrão.
      - name: axiomas dos teoremas finais
        run: |
          set -euo pipefail
          for f in CoveringLean/Syn_K*.lean; do
            out=$(lake env lean "$f" 2>&1 | grep "depends on axioms" || true)
            echo "$f: $out"
            [ -n "$out" ] || { echo "sem #print axioms em $f"; exit 1; }
            echo "$out" | grep -v "depends on axioms: \[propext, Classical.choice, Quot.sound\]" && { echo "axioma extra em $f"; exit 1; } || true
          done
