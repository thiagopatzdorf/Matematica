# Confere os códigos de cobertura com o verificador oficial e compila a biblioteca Lean (alvo padrão).
# Repo público: runner hospedado do GitHub sem custo. Ações fixadas por SHA (comentário = versão).
name: verify-codes

on:
  push:
    paths:
      - "data/**"
      - "tools/**"
      - "scripts/codes/**"
      - "scripts/search/**"
      - "scripts/loop/**"
      - "scripts/publish/**"
      - "ledger/**"
      - "tests/**"
      - "CoveringLean/**"
      - "CoveringLean.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/verify-codes.yml"
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - "scripts/codes/**"
      - "scripts/search/**"
      - "scripts/loop/**"
      - "scripts/publish/**"
      - "ledger/**"
      - "tests/**"
      - "CoveringLean/**"
      - "CoveringLean.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/verify-codes.yml"
  workflow_dispatch:

permissions:
  contents: read

# Push novo no mesmo PR cancela o run velho; na main cada push termina (o cache do Lean sai dele).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verificador oficial + formato estruturado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compilar o verificador (C99, -Werror)
        run: cc -O2 -std=c99 -Wall -Wextra -Werror -o tools/verify/verify tools/verify/verify.c
      - name: check_all (todo data/codes cobre; todo JSON expande para o mesmo sha256 canônico)
        run: time tools/verify/check_all.sh
      # O pytest de `tests` (com nauty) roda no ci.yml, em todo push na main e em todo PR, sem filtro de
      # caminho: aqui ele era a segunda cópia do mesmo teste (5,3 min por run, medido 05–07/10).

  lean:
    name: lake build (alvo padrão)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache dos .olean do PRÓPRIO projeto (.lake/build), por hash do toolchain e do manifest. O lake confere
      # cada módulo pelo hash do fonte (.trace), então restaurar um build velho só recompila o que mudou. O
      # Mathlib continua vindo do `lake exe cache get` da lean-action. Só a main grava (o PR lê o da main).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-padrao-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: lake-padrao-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      # instala o elan/toolchain de lean-toolchain, baixa o cache do Mathlib (lake exe cache get)
      # e roda `lake build` do alvo padrão (CoveringLean). CoveringHeavy (~12 h de CPU) fica fora.
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: true
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-padrao-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
