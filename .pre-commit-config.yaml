# Ganchos locais. Instale com `pre-commit install` (scripts/dev/setup.sh já faz isso).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.(lean|json|csv|gz|svg)$|^data/codes/'
      - id: check-json
        files: '^(ledger|data/structured|verification)/'
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
