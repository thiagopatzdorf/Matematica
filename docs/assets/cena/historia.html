<!doctype html>
<!--
  Cena WebGL do banner e do social preview: o caos do espaço Z_q^n condensando em esferas de Hamming.
  Não é página publicada: docs/assets/gerar_identidade.py a serve num diretório temporário (com three.js e a
  fonte baixados, fixados por versão) e tira o retrato com o Chromium headless.
  Parâmetros: ?tema=escuro|claro&peca=banner|social
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cena</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "CG"; src: url("fontes/cg-500-normal.woff") format("woff"); font-weight: 500; }
  @font-face { font-family: "CG"; src: url("fontes/cg-400-italic.woff") format("woff"); font-style: italic; }
  :root { --fundo: #141414; --tinta: #F6F1E7; --suave: #A9A193; --ouro: #B8975A; --ourotx: #C9AB72; }
  :root[data-tema="claro"] { --fundo: #F6F1E7; --tinta: #141414; --suave: #5C564C; --ourotx: #7A5F2F; }
  html, body { margin: 0; background: var(--fundo); overflow: hidden; }
  #palco { position: relative; }
  canvas { display: block; }
  #texto { position: absolute; inset: 0; pointer-events: none; font-family: "CG", serif; color: var(--tinta); }
  .sobre { position: absolute; letter-spacing: .32em; font-weight: 500; color: var(--ourotx); }
  .titulo { position: absolute; font-weight: 500; letter-spacing: -.005em; line-height: 1; }
  .fio { position: absolute; height: 1px; background: var(--ouro); }
  .sub { position: absolute; font-style: italic; color: var(--suave); line-height: 1.3; }
  /* véu: protege a legibilidade do título sem caixa nem gradiente visível */
  #veu { position: absolute; inset: 0; pointer-events: none; }
</style>
<script type="importmap">{"imports": {"three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/"}}</script>
</head>
<body>
<div id="palco"><div id="veu"></div><div id="texto"></div></div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const q = new URLSearchParams(location.search);
const tema = q.get("tema") || "escuro";
const peca = q.get("peca") || "banner";
const escuro = tema === "escuro";
document.documentElement.dataset.tema = tema;
const W = peca === "banner" ? 1280 : 1280, H = peca === "banner" ? 400 : 640;

// gerador determinístico: a mesma imagem a cada execução (mulberry32)
let semente = peca === "banner" ? 20261006 : 1618;
const rnd = () => { semente |= 0; semente = semente + 0x6D2B79F5 | 0; let t = Math.imul(semente ^ semente >>> 15, 1 | semente);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const FUNDO = new THREE.Color(escuro ? 0x141414 : 0xF6F1E7);
const TINTA = new THREE.Color(escuro ? 0xF6F1E7 : 0x141414);
const OURO = new THREE.Color(0xB8975A);
const OURO_LUZ = new THREE.Color(escuro ? 0xE9CF94 : 0x8C6E36);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(FUNDO, 1);
document.getElementById("palco").prepend(renderer.domElement);

const cena = new THREE.Scene();
// fundo pela cena, não pelo clearColor: com o EffectComposer o clearColor sai sem conversão de espaço de
// cor e o quase-preto virava cinza #4b4b4b (medido no primeiro retrato)
cena.background = FUNDO;
cena.fog = new THREE.FogExp2(FUNDO, escuro ? 0.030 : 0.034);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

// --- geometria do mundo -------------------------------------------------------------------------
// A ordem: quatro esferas tangentes (centros a 2r); cada uma cobre a grade 3x3x3 de palavras cujo
// passo é r/sqrt(3), de modo que os oito cantos ficam exatamente sobre a esfera (distância = raio).
const R = 1.55;
const xOrdem = peca === "banner" ? 9.7 : 7.9;
const centros = [];
for (const sy of [-1, 1]) for (const sx of [-1, 1]) centros.push(new THREE.Vector3(xOrdem + sx * R, sy * R, 0));
const d = R / Math.sqrt(3);
const palavras = [];
for (const c of centros) for (const a of [-1, 0, 1]) for (const b of [-1, 0, 1]) for (const e of [-1, 0, 1])
  palavras.push(new THREE.Vector3(c.x + a * d, c.y + b * d, c.z + e * d));

camera.position.set(peca === "banner" ? 1.2 : 0.4, 0.6, peca === "banner" ? 25 : 27);
camera.lookAt(peca === "banner" ? 2.2 : 1.4, 0, 0);

// --- partículas: nascem dispersas e são puxadas para as palavras conforme o "tempo" p avança ---------
const N = peca === "banner" ? 26000 : 30000;
const pos = new Float32Array(N * 3), cor = new Float32Array(N * 3), tam = new Float32Array(N), alfa = new Float32Array(N);
const xCaos0 = peca === "banner" ? -3.8 : -4.6, xCaos1 = xOrdem - 2 * R;
for (let i = 0; i < N; i++) {
  const p = Math.pow(rnd(), 1.55);
  const xc = xCaos0 + p * (xCaos1 - xCaos0) + gauss() * 1.1 * (1 - p);
  const espalho = 2.3 + 1.2 * (1 - p);
  const yc = gauss() * espalho * 0.7, zc = gauss() * espalho * 1.0;
  const alvo = palavras[Math.floor(rnd() * palavras.length)];
  const w = suave(0.38, 1.0, p);
  // um redemoinho leve: o caos é inquieto, não uniforme
  const ang = (1 - w) * (gauss() * 0.9);
  let x = xc + (alvo.x - xc) * w, y = yc + (alvo.y - yc) * w, z = zc + (alvo.z - zc) * w;
  const cy = y * Math.cos(ang) - z * Math.sin(ang), cz = y * Math.sin(ang) + z * Math.cos(ang);
  y = cy; z = cz;
  // ao pousar, ainda um tremor mínimo em volta da palavra: brilho de condensação
  if (w > 0.92) { x += gauss() * 0.03; y += gauss() * 0.03; z += gauss() * 0.03; }
  pos.set([x, y, z], i * 3);
  const c = TINTA.clone().lerp(OURO_LUZ, Math.pow(w, 2.2) * 0.85);
  cor.set([c.r, c.g, c.b], i * 3);
  tam[i] = (0.6 + rnd() * 1.6) * (1 - 0.45 * w);
  alfa[i] = (0.25 + 0.75 * rnd()) * (escuro ? 0.42 : 0.85) * suave(-0.12, 0.10, p);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setAttribute("cor", new THREE.BufferAttribute(cor, 3));
geo.setAttribute("tam", new THREE.BufferAttribute(tam, 1));
geo.setAttribute("alfa", new THREE.BufferAttribute(alfa, 1));
const matPontos = new THREE.ShaderMaterial({
  uniforms: { escala: { value: H * window.devicePixelRatio * (escuro ? 0.0036 : 0.0042) }, fundo: { value: escuro ? new THREE.Color(0x000000) : FUNDO }, densidadeNevoa: { value: cena.fog.density } },
  vertexShader: `
    attribute vec3 cor; attribute float tam; attribute float alfa;
    varying vec3 vCor; varying float vAlfa; varying float vProf;
    uniform float escala;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vProf = -mv.z; vCor = cor; vAlfa = alfa;
      gl_PointSize = tam * escala * (22.0 / vProf);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vCor; varying float vAlfa; varying float vProf;
    uniform vec3 fundo; uniform float densidadeNevoa;
    void main() {
      vec2 c = gl_PointCoord - 0.5; float r = length(c);
      if (r > 0.5) discard;
      float nucleo = smoothstep(0.5, 0.0, r);
      float nevoa = 1.0 - exp(-pow(densidadeNevoa * vProf, 2.0));
      // com mistura aditiva (tema escuro) a névoa apaga para preto: misturar com a cor do fundo e depois
      // somar acumularia o fundo milhares de vezes e acinzentaria a imagem inteira
      vec3 col = mix(vCor, fundo, nevoa);
      gl_FragColor = vec4(col, vAlfa * nucleo * (1.0 - 0.85 * nevoa));
    }`,
  transparent: true, depthWrite: false,
  blending: escuro ? THREE.AdditiveBlending : THREE.NormalBlending,
});
cena.add(new THREE.Points(geo, matPontos));

// --- as esferas: casca de Fresnel (luz na borda, vazio no centro) + fios de ouro ---------------------
const casca = new THREE.ShaderMaterial({
  uniforms: { cor: { value: OURO_LUZ }, forca: { value: escuro ? 0.55 : 0.38 } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying vec3 vN; varying vec3 vV; uniform vec3 cor; uniform float forca;
    void main() { float f = pow(1.0 - abs(dot(vN, vV)), 3.0); gl_FragColor = vec4(cor, f * forca); }`,
  transparent: true, depthWrite: false, blending: escuro ? THREE.AdditiveBlending : THREE.NormalBlending,
});
const fio = (raio, opac) => new THREE.LineBasicMaterial({ color: escuro ? OURO : new THREE.Color(0x9C7A3F), transparent: true, opacity: opac });
for (const c of centros) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), casca);
  s.position.copy(c); cena.add(s);
  // equador nítido (o contorno que se lê no plano) e dois meridianos quase invisíveis (a profundidade)
  const circ = (rx, ry, op) => {
    const pts = []; for (let k = 0; k <= 256; k++) { const t = k / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(t) * R, Math.sin(t) * R, 0)); }
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), fio(R, op));
    l.rotation.set(rx, ry, 0); l.position.copy(c); cena.add(l);
  };
  circ(0, 0, 1.0);
  circ(Math.PI / 2, 0, 0.22);
  circ(0, Math.PI / 2, 0.22);
  circ(Math.PI / 2.6, Math.PI / 5, 0.12);
}
// as palavras pousadas e os centros: pequenas esferas (ponto do WebGL é quadrado); centro em ouro
const bolinha = (p, raio, cor) => { const m = new THREE.Mesh(new THREE.SphereGeometry(raio, 16, 12),
  new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: 0.95 })); m.position.copy(p); cena.add(m); };
for (const p of palavras) if (!centros.some(c => c.distanceTo(p) < 1e-6)) bolinha(p, 0.035, TINTA);
for (const c of centros) bolinha(c, 0.075, escuro ? 0xE9CF94 : 0x9C7A3F);

// --- render ---------------------------------------------------------------------------------------
if (escuro) {
  const comp = new EffectComposer(renderer);
  comp.addPass(new RenderPass(cena, camera));
  comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.5, 0.42));
  comp.addPass(new OutputPass());
  comp.render();
} else {
  renderer.render(cena, camera);
}

// --- texto (composto sobre a cena, à esquerda, no vazio) -------------------------------------------
const T = document.getElementById("texto");
const L = peca === "banner"
  ? { x: 88, sobre: [150, 13], titulo: [168, 84], fio: 264, sub: [282, 22], subTxt: "do caos à estrutura, da descoberta à prova" }
  : { x: 96, sobre: [234, 16], titulo: [254, 100], fio: 390, sub: [410, 30], subTxt: "do caos à estrutura,<br>da descoberta à prova" };
T.innerHTML = `
  <div class="sobre" style="left:${L.x}px;top:${L.sobre[0] - L.sobre[1]}px;font-size:${L.sobre[1]}px">CÓDIGOS DE COBERTURA</div>
  <div class="titulo" style="left:${L.x - 4}px;top:${L.titulo[0]}px;font-size:${L.titulo[1]}px">Matemática</div>
  <div class="fio" style="left:${L.x}px;top:${L.fio}px;width:${peca === "banner" ? 56 : 68}px"></div>
  <div class="sub" style="left:${L.x}px;top:${L.sub[0]}px;font-size:${L.sub[1]}px">${L.subTxt}</div>`;
document.getElementById("palco").style.cssText = `width:${W}px;height:${H}px`;
const f = escuro ? "20,20,20" : "246,241,231";
document.getElementById("veu").style.background =
  `linear-gradient(90deg, rgba(${f},.92) 0%, rgba(${f},.80) 30%, rgba(${f},0) 46%)`;
await document.fonts.ready;
document.title = "pronto";
</script>
</body>
</html>
